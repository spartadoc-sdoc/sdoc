name: Release

# Publie sdoc-format sur npm à chaque tag de version (ex. v0.1.0).
# NE FAIT RIEN sans : (1) un tag poussé `v*`, ET (2) le secret NPM_TOKEN configuré
# dans le repo. Tant que NPM_TOKEN est absent, l'étape publish échoue proprement
# sans rien exposer — aucune publication accidentelle possible.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour créer la Release GitHub
      id-token: write    # provenance npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
